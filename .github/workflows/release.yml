name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  relay-agent:
    # Each platform builds natively on its own runner, so the Linux
    # executables compile ring against real musl headers (DC-178).
    name: Build relay agent (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: musl-gcc
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: The tag names the relay agent's version
        run: |
          version=$(cargo pkgid -p relay-agent | sed 's/.*[#@]//')
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match relay-agent $version" >&2
            exit 1
          }

      - name: Build, sign and archive
        run: |
          scripts/build-relay-agent.sh "$RUNNER_TEMP/relay-agent" "${{ matrix.platform }}"
          mv "$RUNNER_TEMP/relay-agent/SHA256SUMS" "$RUNNER_TEMP/relay-agent/SHA256SUMS.${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-agent-${{ matrix.platform }}
          path: ${{ runner.temp }}/relay-agent/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: relay-agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-agent-*
          merge-multiple: true
          path: dist

      - name: Verify the archives against their sums
        working-directory: dist
        run: |
          cat SHA256SUMS.* | sort -k2 > SHA256SUMS
          rm SHA256SUMS.*
          test "$(wc -l < SHA256SUMS)" -eq 3
          sha256sum --check --strict SHA256SUMS

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a pre-release part (v0.2.0-rc.1) is published as a
          # pre-release, so it never becomes the repository's latest release.
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}" dist/*
