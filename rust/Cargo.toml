[workspace]
resolver = "2"
members = [
  "crates/lease-keys",
  "crates/service-layout",
  "crates/second-instance",
  "crates/byte-transfer",
  "crates/discovery",
  "crates/environment",
  "crates/acquisition-options",
  "crates/control-only",
  "crates/guest-firewall",
  "crates/guest-dot-forwarder",
  "crates/application-catalog",
  "crates/console",
  "crates/machine-service-core",
  "crates/machine-service",
  "crates/machctl",
  "crates/console-worker",
  "crates/guest-console-agent",
  "crates/guest-actions",
  "crates/guest-session",
  "crates/relay-agent",
  "crates/machine-service-install",
  "crates/runtime-launcher",
  "crates/remote-session",
  "crates/network-rig",
  "crates/relay-broker",
  "crates/relay-acceptance",
  "crates/lab-runners",
]

[workspace.package]
version = "0.2.0-rc.4"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rand = "0.10"
tempfile = "3"
thiserror = "2"
tar = { version = "0.4", default-features = false }

[profile.release]
strip = true

# The tests hash and move gigabytes (RP-15); an unoptimized SHA-256 would
# take minutes over them.
[profile.dev.package.sha2]
opt-level = 3
