[package]
name = "relay-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relay_broker"
path = "src/lib.rs"

[dependencies]
service-layout = { path = "../service-layout" }
byte-transfer = { path = "../byte-transfer" }
remote-session = { path = "../remote-session" }
relay-agent = { path = "../relay-agent" }
guest-actions = { path = "../guest-actions" }
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
libc.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
tempfile.workspace = true
byte-transfer = { path = "../byte-transfer" }
