[package]
name = "lab-runners"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "lab-host: the runner controller of the lab's ephemeral GitHub Actions runners and per-run test environments (docs/arch/lab-runners.md)"

[lib]
name = "lab_runners"
path = "src/lib.rs"

[[bin]]
name = "lab-host"
path = "src/main.rs"

[dependencies]
guest-firewall = { path = "../guest-firewall" }
guest-dot-forwarder = { path = "../guest-dot-forwarder" }
machine-service-core = { path = "../machine-service-core" }
service-layout = { path = "../service-layout" }
second-instance = { path = "../second-instance" }
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
rand.workspace = true
tempfile.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
service-layout = { path = "../service-layout", features = ["test-build"] }
tiny_http.workspace = true
tempfile.workspace = true
