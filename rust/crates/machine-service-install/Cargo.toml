[package]
name = "machine-service-install"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "machine-service-install"
path = "src/main.rs"

[lib]
name = "machine_service_install"
path = "src/lib.rs"

[dependencies]
environment = { path = "../environment" }
service-layout = { path = "../service-layout" }
console = { path = "../console" }
machine-service-core = { path = "../machine-service-core" }
serde.workspace = true
clap.workspace = true
serde_json.workspace = true
libc.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The daemon and installer a test runs take the test's own launchctl
# (DC-1xx-LCTL-1); `cargo build` never enables this.
machine-service-core = { path = "../machine-service-core", features = ["test-launchd"] }
serde_json.workspace = true
tempfile.workspace = true
