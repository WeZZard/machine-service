[package]
name = "relay-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "relay-agent"
path = "src/main.rs"

[dependencies]
guest-actions = { path = "../guest-actions" }
remote-session = { path = "../remote-session" }
service-layout = { path = "../service-layout" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The agent a test runs is a test build that watches its lifeline
# (DC-1xx-ISO-6); `cargo build` never enables this.
service-layout = { path = "../service-layout", features = ["test-build"] }
tempfile.workspace = true
byte-transfer = { path = "../byte-transfer" }
