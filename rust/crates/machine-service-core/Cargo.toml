[package]
name = "machine-service-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# The test seam of `launchd`: a test's own launchctl instead of /bin/launchctl
# (DC-1xx-LCTL-1). Only dev-dependencies enable it, so only `cargo test`
# builds it into a binary; a release build never carries it.
test-launchd = []

[dependencies]
byte-transfer = { path = "../byte-transfer" }
lease-keys = { path = "../lease-keys" }
service-layout = { path = "../service-layout" }
environment = { path = "../environment" }
acquisition-options = { path = "../acquisition-options" }
control-only = { path = "../control-only" }
guest-firewall = { path = "../guest-firewall" }
application-catalog = { path = "../application-catalog" }
console = { path = "../console" }
guest-session = { path = "../guest-session" }
relay-agent = { path = "../relay-agent" }
relay-broker = { path = "../relay-broker" }
remote-session = { path = "../remote-session" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
tempfile.workspace = true
libc.workspace = true
rand.workspace = true
thiserror.workspace = true
