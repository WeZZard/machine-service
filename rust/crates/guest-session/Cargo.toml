[package]
name = "guest-session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "guest-session-agent"
path = "src/main.rs"

[dependencies]
guest-actions = { path = "../guest-actions" }
serde_json.workspace = true
libc.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The agent a test runs is an isolated test child (DC-1xx-ISO-1).
service-layout = { path = "../service-layout", features = ["test-build"] }
